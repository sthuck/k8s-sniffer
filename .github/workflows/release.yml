# Cut a tagged GitHub release: test, cross-compile, notes, upload archives.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0). Leave empty to bump minor from the latest tag."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be created from main (got ${GITHUB_REF})" >&2
            exit 1
          fi

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          args=()
          if [ -n "${INPUT_VERSION}" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          eval "$(./scripts/release-version.sh "${args[@]}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (previous: ${PREVIOUS_TAG:-none})"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install protoc
        run: |
          set -euo pipefail
          PROTOC_VERSION="$(sed -n 's/^PROTOC_VERSION ?= //p' Makefile)"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'include/*'
          rm /tmp/protoc.zip
          protoc --version

      - name: Verify
        run: make verify

      - name: Integration (envtest)
        run: make integration-test

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make dist DIST_GOOS=${{ matrix.goos }} DIST_GOARCH=${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/k8s-sniffer_*
          if-no-files-found: error

  release:
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum k8s-sniffer_* | tee checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(
            "$VERSION"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
          )
          if [ -n "${PREVIOUS_TAG}" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          shopt -s nullglob
          args+=(dist/k8s-sniffer_* dist/checksums.txt)
          gh release create "${args[@]}"
