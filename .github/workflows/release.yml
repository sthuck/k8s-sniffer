# Cut a tagged GitHub release: same test gate as PRs, GHCR agent image,
# digest-pinned CLI archives, notes, tag + assets.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0). Leave empty to bump minor from the latest tag."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be created from main (got ${GITHUB_REF})" >&2
            exit 1
          fi

  prepare:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          args=()
          if [ -n "${INPUT_VERSION}" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          ./scripts/release-version.sh "${args[@]}"

  test:
    needs: [guard]
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  image:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      agent_image: ${{ steps.publish.outputs.agent_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish agent image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/k8s-sniffer-agent"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build --target agent \
            --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            .
          docker push "${image}:${VERSION}"
          docker push "${image}:latest"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:${VERSION}")"
          case "${digest_ref}" in
          *@sha256:*) ;;
          *)
            docker pull "${image}:${VERSION}"
            digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:${VERSION}")"
            ;;
          esac
          case "${digest_ref}" in
          *@sha256:*) ;;
          *)
            echo "failed to resolve digest for ${image}:${VERSION} (got ${digest_ref})" >&2
            exit 1
            ;;
          esac
          echo "agent_image=${digest_ref}" >> "$GITHUB_OUTPUT"
          echo "Published ${digest_ref}"

  build:
    needs: [prepare, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AGENT_IMAGE: ${{ needs.image.outputs.agent_image }}
        run: make dist DIST_GOOS=${{ matrix.goos }} DIST_GOARCH=${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/k8s-sniffer_*
          if-no-files-found: error

  release:
    needs: [prepare, test, image, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum k8s-sniffer_* | tee checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          AGENT_IMAGE: ${{ needs.image.outputs.agent_image }}
        run: |
          set -euo pipefail
          args=(
            "$VERSION"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
            --notes "Agent image: \`${AGENT_IMAGE}\`"
          )
          if [ -n "${PREVIOUS_TAG}" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          shopt -s nullglob
          args+=(dist/k8s-sniffer_* dist/checksums.txt)
          gh release create "${args[@]}"
